<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>32 Visualisations</title>
<style>
  :root { --bg:#07070d; --panel:#12121c; --text:#e8e8f2; --muted:#8a8aa3; --accent:#7c5cff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #drop { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; z-index:5; background:rgba(7,7,13,.78); }
  #drop.hidden { display:none; }
  #drop h1 { margin:0; font-size:clamp(28px,6vw,52px); letter-spacing:.02em; }
  #drop p { margin:0; color:var(--muted); }
  button, .btn { background:var(--panel); color:var(--text); border:1px solid #2a2a3d; border-radius:10px; padding:10px 14px; font-size:14px; cursor:pointer; }
  button:hover, .btn:hover { border-color:var(--accent); }
  .primary { background:var(--accent); border-color:var(--accent); font-weight:600; }
  #bar { position:fixed; left:0; right:0; bottom:0; z-index:4; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(transparent,rgba(7,7,13,.92) 40%); display:flex; flex-direction:column; gap:8px; transition:opacity .4s; }
  #bar.idle { opacity:0; pointer-events:none; }
  #title { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #vizname { color:var(--muted); font-size:12px; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  input[type=range] { accent-color:var(--accent); }
  #seek { flex:1; min-width:120px; }
  #vol { width:90px; }
  .time { font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; min-width:84px; text-align:center; }
  #list { position:fixed; top:0; right:0; bottom:0; width:min(320px,86vw); background:var(--panel); z-index:6; transform:translateX(100%); transition:transform .25s; padding:14px; overflow:auto; border-left:1px solid #2a2a3d; }
  #list.open { transform:none; }
  #list h3 { margin:0 0 10px; font-size:14px; color:var(--muted); font-weight:600; }
  .item { padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item:hover { background:#1c1c2c; }
  .item.cur { background:var(--accent); }
  #toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid #2a2a3d; border-radius:10px; padding:8px 14px; font-size:13px; z-index:9; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="drop">
  <h1>32 Visualisations</h1>
  <p>Select or drop MP3 files to start. (MP3 only &mdash; video files like MP4 are not accepted.)</p>
  <label class="btn primary">Select MP3
    <input id="file" type="file" accept=".mp3,audio/mpeg" multiple hidden>
  </label>
</div>

<div id="bar">
  <div><div id="title">No track loaded</div><div id="vizname"></div></div>
  <div class="row">
    <button id="prev" title="Previous track">&#9198;</button>
    <button id="play" class="primary" title="Play / Pause (Space)">&#9654;</button>
    <button id="next" title="Next track">&#9197;</button>
    <span class="time" id="time">0:00 / 0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <input id="vol" type="range" min="0" max="100" value="80" title="Volume">
  </div>
  <div class="row">
    <button id="vprev" title="Previous visualisation (&larr;)">&#9664; Viz</button>
    <button id="vnext" title="Next visualisation (&rarr;)">Viz &#9654;</button>
    <button id="auto" title="Auto-cycle visualisations (A)">Auto: off</button>
    <button id="add" title="Add MP3 files">+ MP3</button>
    <button id="plbtn" title="Playlist (L)">Playlist</button>
    <button id="fs" title="Fullscreen (F)">Fullscreen</button>
  </div>
</div>

<div id="list"><h3>PLAYLIST</h3><div id="items"></div></div>
<div id="toast"></div>
<audio id="audio" preload="auto"></audio>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('stage'), ctx = canvas.getContext('2d');
  const audio = $('audio');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = Math.floor(innerWidth * DPR);
    H = canvas.height = Math.floor(innerHeight * DPR);
  }
  addEventListener('resize', resize); resize();

  // ---------- Audio graph ----------
  let ac, analyser, freq, wave, gainNode, srcNode;
  function initAudio() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    analyser = ac.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.8;
    freq = new Uint8Array(analyser.frequencyBinCount);
    wave = new Uint8Array(analyser.fftSize);
    gainNode = ac.createGain();
    gainNode.gain.value = $('vol').value / 100;
    srcNode = ac.createMediaElementSource(audio);
    srcNode.connect(analyser); analyser.connect(gainNode); gainNode.connect(ac.destination);
  }

  // ---------- Playlist (MP3 only) ----------
  const tracks = []; let cur = -1;
  function isMp3(f) { return /\.mp3$/i.test(f.name) || f.type === 'audio/mpeg'; }
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400); }
  function addFiles(files) {
    const all = [...files], ok = all.filter(isMp3);
    if (ok.length < all.length) toast('Only MP3 files are supported — skipped ' + (all.length - ok.length));
    if (!ok.length) return;
    const first = tracks.length === 0;
    ok.forEach(f => tracks.push({ name: f.name.replace(/\.mp3$/i, ''), url: URL.createObjectURL(f) }));
    renderList();
    if (first) loadTrack(0, true);
    $('drop').classList.add('hidden');
  }
  function renderList() {
    const box = $('items'); box.innerHTML = '';
    tracks.forEach((t, i) => {
      const d = document.createElement('div');
      d.className = 'item' + (i === cur ? ' cur' : ''); d.textContent = (i + 1) + '. ' + t.name;
      d.onclick = () => loadTrack(i, true); box.appendChild(d);
    });
  }
  function loadTrack(i, autoplay) {
    if (!tracks.length) return;
    cur = (i + tracks.length) % tracks.length;
    audio.src = tracks[cur].url; $('title').textContent = tracks[cur].name; renderList();
    if (autoplay) play();
  }
  async function play() { initAudio(); if (ac.state === 'suspended') await ac.resume(); try { await audio.play(); } catch (e) {} }
  function toggle() { if (!tracks.length) return $('file').click(); audio.paused ? play() : audio.pause(); }

  $('file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  $('add').onclick = () => $('file').click();
  $('play').onclick = toggle;
  $('prev').onclick = () => loadTrack(cur - 1, true);
  $('next').onclick = () => loadTrack(cur + 1, true);
  $('plbtn').onclick = () => $('list').classList.toggle('open');
  $('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  $('vol').oninput = e => { if (gainNode) gainNode.gain.value = e.target.value / 100; audio.volume = 1; };
  audio.onplay = () => $('play').innerHTML = '&#10074;&#10074;';
  audio.onpause = () => $('play').innerHTML = '&#9654;';
  audio.onended = () => loadTrack(cur + 1, true);
  let seeking = false;
  $('seek').oninput = () => { seeking = true; };
  $('seek').onchange = e => { if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; seeking = false; };
  const fmt = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
  audio.ontimeupdate = () => {
    $('time').textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
    if (!seeking && audio.duration) $('seek').value = audio.currentTime / audio.duration * 1000;
  };
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); addFiles(e.dataTransfer.files); });

  // ---------- Visualisations: 8 families x 4 variants = 32 ----------
  const palettes = [
    { name: 'Neon',   h: t => 280 + t * 80 },
    { name: 'Fire',   h: t => 5 + t * 55 },
    { name: 'Ocean',  h: t => 170 + t * 70 },
    { name: 'Rainbow', h: t => t * 360 },
  ];
  const col = (p, t, l = 58, a = 1) => `hsla(${palettes[p].h(t) % 360},90%,${l}%,${a})`;
  const bins = (f, n) => { // log-ish downsample of spectrum to n bands (0..1)
    const out = new Float32Array(n), max = Math.floor(f.length * 0.75);
    for (let i = 0; i < n; i++) {
      const a = Math.floor(Math.pow(i / n, 2) * max), b = Math.max(a + 1, Math.floor(Math.pow((i + 1) / n, 2) * max));
      let s = 0; for (let k = a; k < b; k++) s += f[k]; out[i] = s / (b - a) / 255;
    }
    return out;
  };
  let parts = [];
  const families = [
    { name: 'Bars', draw(s, p, T) {
        const n = 64, b = bins(s.f, n), w = W / n;
        for (let i = 0; i < n; i++) {
          const h = b[i] * H * 0.7; ctx.fillStyle = col(p, i / n);
          ctx.fillRect(i * w + 1, H - h, w - 2, h);
          if (p % 2) { ctx.fillStyle = col(p, i / n, 70, .25); ctx.fillRect(i * w + 1, H, w - 2, h * .3); }
        }
    }},
    { name: 'Radial', draw(s, p, T) {
        const n = 96, b = bins(s.f, n), cx = W / 2, cy = H / 2, r0 = Math.min(W, H) * 0.16;
        ctx.lineWidth = Math.max(2, W / 400); ctx.lineCap = 'round';
        for (let i = 0; i < n; i++) {
          const a = i / n * Math.PI * 2 + T * 0.2, r1 = r0 + b[i] * Math.min(W, H) * 0.32;
          ctx.strokeStyle = col(p, i / n);
          ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.stroke();
        }
    }},
    { name: 'Waveform', draw(s, p, T) {
        const d = s.w, n = d.length, lines = 3;
        ctx.lineWidth = Math.max(2, W / 500);
        for (let l = 0; l < lines; l++) {
          ctx.strokeStyle = col(p, l / lines, 60, 1 - l * .3); ctx.beginPath();
          for (let i = 0; i < n; i += 4) {
            const x = i / n * W, y = H / 2 + (d[i] - 128) / 128 * H * 0.35 * (1 - l * .25);
            i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
          }
          ctx.stroke();
        }
    }},
    { name: 'Circle Wave', draw(s, p, T) {
        const d = s.w, n = 256, cx = W / 2, cy = H / 2, r = Math.min(W, H) * 0.22;
        for (let l = 0; l < 3; l++) {
          ctx.lineWidth = Math.max(2, W / 450); ctx.strokeStyle = col(p, l / 3, 60, 1 - l * .28); ctx.beginPath();
          for (let i = 0; i <= n; i++) {
            const k = i % n, a = k / n * Math.PI * 2 + T * 0.1 * (l + 1), rr = r * (1 + l * .35) + (d[k * 4] - 128) / 128 * r * 0.7;
            const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
          }
          ctx.stroke();
        }
    }},
    { name: 'Particles', draw(s, p, T) {
        const cx = W / 2, cy = H / 2, bass = s.bass;
        if (bass > 0.55 || Math.random() < 0.15) for (let i = 0; i < 6 + bass * 18; i++) {
          const a = Math.random() * Math.PI * 2, v = (1 + Math.random() * 5) * (0.5 + bass) * DPR;
          parts.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, t: Math.random() });
        }
        parts = parts.filter(q => q.life > 0 && q.x > -50 && q.x < W + 50 && q.y > -50 && q.y < H + 50);
        if (parts.length > 1500) parts.splice(0, parts.length - 1500);
        for (const q of parts) {
          q.x += q.vx; q.y += q.vy; q.life -= 0.008; ctx.fillStyle = col(p, q.t, 60, Math.max(q.life, 0));
          ctx.beginPath(); ctx.arc(q.x, q.y, (2 + q.life * 3) * DPR, 0, 7); ctx.fill();
        }
    }},
    { name: 'Mountains', draw(s, p, T) {
        const n = 48, b = bins(s.f, n);
        for (let l = 0; l < 3; l++) {
          ctx.fillStyle = col(p, l / 3, 50 + l * 6, 0.55); ctx.beginPath(); ctx.moveTo(0, H);
          for (let i = 0; i < n; i++) {
            const x = i / (n - 1) * W, y = H - b[i] * H * (0.6 - l * 0.12) - H * 0.05 * l - Math.sin(i * .6 + T + l) * H * 0.015;
            ctx.lineTo(x, y);
          }
          ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
        }
    }},
    { name: 'Tunnel', draw(s, p, T) {
        const cx = W / 2, cy = H / 2, rings = 14, m = Math.min(W, H);
        for (let i = rings; i > 0; i--) {
          const ph = ((i / rings) + T * 0.15) % 1, r = Math.pow(ph, 2) * m * 0.7 * (1 + s.bass * 0.25);
          ctx.lineWidth = 1 + ph * 6 * DPR; ctx.strokeStyle = col(p, ph, 60, 0.15 + ph * .7); ctx.beginPath();
          const sides = p % 2 ? 6 : 64; for (let k = 0; k <= sides; k++) {
            const a = k / sides * Math.PI * 2 + T * 0.3 * (i % 2 ? 1 : -1); k ? ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
          }
          ctx.stroke();
        }
    }},
    { name: 'Matrix', draw(s, p, T) {
        const cols = 24, rows = 14, b = bins(s.f, cols), cw = W / cols, ch = H * 0.8 / rows;
        for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
          const on = (r / rows) < b[c] * 1.1, x = c * cw + cw / 2, y = H * 0.9 - r * ch - ch / 2;
          ctx.fillStyle = on ? col(p, r / rows) : 'rgba(255,255,255,0.05)';
          ctx.beginPath(); ctx.arc(x, y, Math.min(cw, ch) * 0.36, 0, 7); ctx.fill();
        }
    }},
  ];
  const viz = []; // 32 entries
  for (let f = 0; f < families.length; f++) for (let p = 0; p < palettes.length; p++) viz.push({ fam: families[f], p, name: families[f].name + ' \u2013 ' + palettes[p].name });
  let vi = 0, autoOn = false, autoT = 0;
  function setViz(i) { vi = (i + viz.length) % viz.length; parts = []; $('vizname').textContent = (vi + 1) + '/32 \u00b7 ' + viz[vi].name; toast(viz[vi].name); }
  $('vprev').onclick = () => setViz(vi - 1);
  $('vnext').onclick = () => setViz(vi + 1);
  $('auto').onclick = () => { autoOn = !autoOn; $('auto').textContent = 'Auto: ' + (autoOn ? 'on' : 'off'); };
  setViz(0);

  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowRight') setViz(vi + 1);
    else if (e.code === 'ArrowLeft') setViz(vi - 1);
    else if (e.key === 'f' || e.key === 'F') $('fs').click();
    else if (e.key === 'a' || e.key === 'A') $('auto').click();
    else if (e.key === 'l' || e.key === 'L') $('plbtn').click();
    else if (/^[1-9]$/.test(e.key)) setViz(parseInt(e.key) - 1);
  });

  // ---------- idle UI hide ----------
  let idle; const bar = $('bar');
  const wake = () => { bar.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => { if (!audio.paused) bar.classList.add('idle'); }, 3500); };
  ['mousemove', 'touchstart', 'keydown', 'click'].forEach(ev => addEventListener(ev, wake)); wake();

  // ---------- Render loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = (now - last) / 1000; last = now;
    ctx.fillStyle = 'rgba(7,7,13,0.28)'; ctx.fillRect(0, 0, W, H);
    const s = { f: freq || new Uint8Array(1024), w: wave || new Uint8Array(2048).fill(128), bass: 0 };
    if (analyser) { analyser.getByteFrequencyData(s.f); analyser.getByteTimeDomainData(s.w); let sum = 0; for (let i = 0; i < 8; i++) sum += s.f[i]; s.bass = sum / 8 / 255; }
    const v = viz[vi]; v.fam.draw(s, v.p, now / 1000);
    if (autoOn && !audio.paused) { autoT += dt; if (autoT > 12) { autoT = 0; setViz(vi + 1); } }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
